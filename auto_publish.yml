name: Auto publish videos

on:
  schedule:
    # GitHub cron is UTC. 16:00 and 20:00 at UTC+03:00 = 13:00 and 17:00 UTC.
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests edge-tts

      - name: Generate and publish
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          GH_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MIN_AUDIO_SECONDS: '85'
          MAX_AUDIO_SECONDS: '89'
          MIN_SCRIPT_WORDS: '145'
          MAX_SCRIPT_WORDS: '165'
          TOPIC_HISTORY_FILE: 'topic_history.json'
        run: python 'main(4).py'

      - name: Persist topic history
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add topic_history.json
          git diff --cached --quiet || git commit -m 'chore: persist published topic history'
          git push
