name: Auto Publish Shorts

on:
  workflow_dispatch: {}   # allows manual runs from the Actions tab
  schedule:
    # Egypt currently observes DST (Egyptian Eastern Summer Time, UTC+3)
    # from the last Friday of April through the last Friday of October.
    # As of writing (Sep 2026) Cairo is UTC+3, so the cron below is offset
    # by -3 hours from Cairo local time, NOT -2. This will need to change
    # back to UTC+2 offsets once Egypt reverts to standard time on
    # Oct 29, 2026 (i.e. back to "0 13 * * *" / "0 19 * * *").
    #
    # 3:00 PM Cairo (UTC+3, DST) -> 12:00 UTC
    - cron: "0 12 * * *"
    # 9:00 PM Cairo (UTC+3, DST) -> 18:00 UTC
    - cron: "0 18 * * *"
    #
    # --- After Oct 29, 2026 (Egypt back to UTC+2 standard time), swap to: ---
    # - cron: "0 13 * * *"   # 3:00 PM Cairo (UTC+2)
    # - cron: "0 19 * * *"   # 9:00 PM Cairo (UTC+2)

concurrency:
  group: auto-publish-${{ github.ref }}
  cancel-in-progress: false

# Needed so the built-in GITHUB_TOKEN can create a Release and upload the
# video as an asset (this is how Buffer gets a public URL to fetch it from).
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (with libass for subtitle burn-in)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run content pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          # The built-in, auto-generated token — no need to create your own.
          # 'permissions: contents: write' above is what lets it create a
          # Release in this repo.
          GH_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Upload run artifacts (topic, subtitles, final video) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-${{ github.run_id }}
          path: work/
          retention-days: 5
