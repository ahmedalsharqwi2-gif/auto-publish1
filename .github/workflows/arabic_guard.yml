name: Arabic Guard CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  arabic-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run Arabic guard tests
        run: python -m unittest discover -s tests -p 'test_arabic_guard.py' -v
