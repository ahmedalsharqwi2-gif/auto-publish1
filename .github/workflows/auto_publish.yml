name: Auto publish Reels (Cairo 15-19)

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

concurrency:
  group: auto-publish-reels
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Show scheduled trigger time
        env:
          TZ: Africa/Cairo
        run: |
          echo "GitHub event: ${{ github.event_name }}"
          echo "Scheduled cron expression: ${{ github.event.schedule }}"
          echo "GitHub UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Cairo local time: $(date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check publishing secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY is required"; exit 1; }
          test -n "$BUFFER_API_KEY" || { echo "BUFFER_API_KEY is required"; exit 1; }
          test -n "$BUFFER_CHANNEL_IDS" || { echo "BUFFER_CHANNEL_IDS must contain comma-separated Buffer channel IDs"; exit 1; }

      - name: Install runtime dependencies and video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate, render and queue Reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-2.5-flash,gemini-2.5-flash-lite'
          GEMINI_THINKING_LEVEL: 'low'
          GEMINI_RETRIES: '3'

          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          BUFFER_POST_MODE: 'addToQueue'

          TTS_ENGINE: 'edge'
          EDGE_TTS_VOICE: 'ar-SA-HamedNeural'
          EDGE_TTS_RATE: '+10%'

          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

          MIN_WORDS: '90'
          MAX_WORDS: '165'
          MAX_REEL_SECONDS: '90'
          MIN_QUALITY_SCORE: '0.75'
          OUTPUT_DIR: 'output'
          CATEGORY: 'عام'
          LOG_LEVEL: 'INFO'
        run: python main.py
