name: Auto publish videos (Cairo 15-19)

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

concurrency:
  group: auto-publish-voice-rotation
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on
