name: Auto publish videos (Cairo 15-19)

on:
  schedule:
    # GitHub cron is UTC. Cairo target times: start at 14:00 and 18:00
    # local time (UTC+03:00), allowing one hour for generation before
    # immediate publication at 15:00 and 19:00.
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Show scheduled trigger time
        env:
          TZ: Africa/Cairo
        run: |
          echo "GitHub event: ${{ github.event_name }}"
          echo "Scheduled cron expression: ${{ github.event.schedule }}"
          echo "GitHub UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Cairo local time: $(date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          edge-tts --voice ar-EG-ShakirNeural \
            --text "في عام 1943، بدأت خطة خداع عسكرية بوثيقة صغيرة، لكنها غيرت مسار معركة كاملة." \
            --write-media assets_voice_reference_synthetic.mp3
          mkdir -p assets
          ffmpeg -y -i assets_voice_reference_synthetic.mp3 \
            -ac 1 -ar 24000 -sample_fmt s16 -t 8 \
            assets/voice_reference_synthetic.wav

      - name: Generate and publish
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          GH_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MIN_AUDIO_SECONDS: '85'
          MAX_AUDIO_SECONDS: '89'
          TARGET_AUDIO_SECONDS: '87'
          MIN_SCRIPT_WORDS: '135'
          MAX_SCRIPT_WORDS: '165'
          MIN_SCENE_CLIPS: '4'
          TOPIC_HISTORY_FILE: 'topic_history.json'
          TTS_ENGINE: 'silma'
          SILMA_REFERENCE_WAV: 'assets/voice_reference_synthetic.wav'
          SILMA_REFERENCE_TEXT: 'في عام 1943، بدأت خطة خداع عسكرية بوثيقة صغيرة، لكنها غيرت مسار معركة كاملة.'
          SILMA_SPEED: '1.0'
          SILMA_GUARD_ENABLED: 'true'
          SILMA_FALLBACK_TO_EDGE: 'true'
          EDGE_TTS_RATE: '-8%'
          EDGE_TTS_PITCH: '-5Hz'
        run: |
          echo "Python files in repository:"
          find . -maxdepth 2 -type f -name '*.py' -print
          test -f main.py || { echo "ERROR: main.py is missing from the repository"; exit 1; }
          python main.py

      - name: Persist topic history
        # Persist even when footage/publishing fails: the generated topic has
        # already been used and must not be offered again on the next run.
        if: always()
        run: |
          if [ ! -f topic_history.json ]; then
            echo "topic_history.json was not created; the pipeline failed before a topic was saved."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add topic_history.json
          git diff --cached --quiet || git commit -m 'chore: persist published topic history'
          git push
