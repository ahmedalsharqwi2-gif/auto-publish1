name: Auto publish videos (Cairo 14-18)
on:
  schedule:
    # Prepare one hour before the fixed Cairo publication slots 14:00 and 18:00.
    - cron: '0 10 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      voice_profile:
        description: 'SILMA voice profile'
        required: false
        default: 'auto'
        type: string
      dry_run:
        description: 'Build and validate without publishing externally'
        required: false
        default: false
        type: boolean

concurrency:
  group: auto-publish-voice-rotation
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    # Cold SILMA/Whisper setup plus TTS and FFmpeg can exceed one hour.
    timeout-minutes: 180
    steps:
      - name: Show scheduled trigger time
        env:
          TZ: Africa/Cairo
        run: |
          echo "GitHub event: ${{ github.event_name }}"
          echo "Scheduled cron expression: ${{ github.event.schedule }}"
          echo "GitHub UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Cairo local time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
      - name: Set fixed publication slot
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone

          now = datetime.now(timezone.utc)
          expression = os.environ.get("SCHEDULE_EXPR", "")
          target_hour = {"0 10 * * *": 11, "0 14 * * *": 15}.get(expression)
          if target_hour is None:
              slots = [now.replace(hour=11, minute=0, second=0, microsecond=0),
                       now.replace(hour=15, minute=0, second=0, microsecond=0)]
              target = next((slot for slot in slots if slot > now), slots[0] + timedelta(days=1))
          else:
              target = now.replace(hour=target_hour, minute=0, second=0, microsecond=0)
              if target <= now:
                  target += timedelta(days=1)
          due_at = target.isoformat(timespec="seconds").replace("+00:00", "Z")
          print(f"Fixed publication slot: {due_at} UTC")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"PUBLISH_DUE_AT={due_at}\n")
          PY

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check Gemini API key (fail fast)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY || secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            if [ -n "$LLM_FALLBACK_API_KEY" ]; then
              echo "WARNING: GEMINI_API_KEY is missing; using the configured fallback provider."
              exit 0
            fi
            echo "ERROR: GEMINI_API_KEY and fallback LLM secrets are missing or empty"
            exit 1
          fi
          KEY_CLEAN="$(printf '%s' "$GEMINI_API_KEY" | tr -d '[:space:]"'"'"'')"
          case "$KEY_CLEAN" in
            AQ.*)   echo "Key type: authorization key (AQ.)" ;;
            AIza*)  echo "Key type: standard key (AIza)" ;;
            *)      echo "WARNING: unrecognized key format (expected an AQ. or AIza prefix)" ;;
          esac
          CODE="$(curl -s -o /tmp/gemini_check.json -w '%{http_code}' \
            -H "x-goog-api-key: $KEY_CLEAN" \
            'https://generativelanguage.googleapis.com/v1beta/models?pageSize=1')"
          echo "Gemini models endpoint HTTP status: $CODE"
          if [ "$CODE" != "200" ]; then
            head -c 500 /tmp/gemini_check.json
            echo
            if [ -n "$LLM_FALLBACK_API_KEY" ]; then
              echo "WARNING: Gemini preflight failed; continuing with the configured fallback provider."
              exit 0
            fi
            echo "ERROR: Gemini rejected the key and no fallback provider is configured."
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Edge TTS installation
        run: python -c "import edge_tts; print('edge-tts import OK:', getattr(edge_tts, '__version__', 'installed'))"

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1

      - name: Validate rotating SILMA voice profiles
        env:
          SILMA_VOICE_PROFILES_FILE: 'assets/voices/voice_profiles.json'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import json
          config = json.loads(Path(os.environ["SILMA_VOICE_PROFILES_FILE"]).read_text())
          profiles = config.get("profiles", {})
          assert profiles, "No SILMA voice profiles configured"
          for profile_id, profile in profiles.items():
              from tts_quality import resolve_reference_profile
              wav, text = resolve_reference_profile(profile_id, Path(os.environ["SILMA_VOICE_PROFILES_FILE"]))
              print(f"Validated rotating profile {profile_id}: {wav} ({len(text.split())} words)")
          PY

      - name: Run unit tests
        run: |
          # The modular pipeline no longer exports the legacy main.py API.
          # Run every current modular test; legacy main.py compatibility tests
          # are intentionally excluded until they are migrated.
          python -m unittest \
            tests.test_arabic_guard \
            tests.test_arabic_speech_core \
            tests.test_content_generator \
            tests.test_content_length_policy \
            tests.test_fact_check \
            tests.test_llm_gemini \
            tests.test_pexels_video \
            tests.test_provider_pool \
            tests.test_publish_content \
            tests.test_quality_gate \
            tests.test_tts_quality \
            tests.test_video_assembly -v

      - name: Validate publishing configuration
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          GH_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$BUFFER_API_KEY" || { echo "ERROR: BUFFER_API_KEY is missing"; exit 1; }
          test -n "$BUFFER_CHANNEL_IDS" || { echo "ERROR: BUFFER_CHANNEL_IDS is missing"; exit 1; }
          test -n "$GH_RELEASE_TOKEN" || { echo "ERROR: GitHub release token is missing"; exit 1; }
          echo "Publishing credentials and channel mapping are present."

      - name: Arabic preflight gates (science)
        env:
          EDGE_TTS_VOICE: "ar-EG-ShakirNeural"
          TTS_ENGINE: "edge"
        run: |
          python -m arabic_speech_core.cli preflight --text "هذه عينة عربية قصيرة للتحقق من اللغة والمزود قبل توليد المحتوى العلمي." --engine edge --locale ar-SA --voice "$EDGE_TTS_VOICE" --lexicon config/arabic_pronunciation.json --min-words 8 --max-words 40

      - name: Resolve available fallback model
        env:
          FALLBACK_KEY: ${{ secrets.LLM_FALLBACK_API_KEY || secrets.GROQ_API_KEY }}
          FALLBACK_ENDPOINT: ${{ vars.LLM_FALLBACK_ENDPOINT || 'https://api.groq.com/openai/v1/chat/completions' }}
        run: |
          if [ -z "$FALLBACK_KEY" ]; then
            echo "No OpenAI-compatible fallback key; skipping model discovery."
            exit 0
          fi
          MODELS_URL="${FALLBACK_ENDPOINT%/chat/completions}/models"
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $FALLBACK_KEY" "$MODELS_URL" > /tmp/fallback_models.json
          SELECTED_MODEL="$(python - <<'PY'
          import json
          from pathlib import Path
          preferred = (
              "openai/gpt-oss-120b",
              "openai/gpt-oss-20b",
              "llama-3.3-70b-versatile",
              "llama-3.1-8b-instant",
              "moonshotai/kimi-k2-instruct",
          )
          data = json.loads(Path("/tmp/fallback_models.json").read_text())
          ids = [str(item.get("id")) for item in data.get("data", []) if item.get("id")]
          selected = next((name for name in preferred if name in ids), ids[0] if ids else "")
          print(selected)
          PY
          )"
          if [ -n "$SELECTED_MODEL" ]; then
            echo "Resolved fallback model: $SELECTED_MODEL"
            echo "LLM_FALLBACK_MODEL=$SELECTED_MODEL" >> "$GITHUB_ENV"
          else
            echo "ERROR: fallback endpoint returned no usable models"
            exit 1
          fi

      - name: Generate and publish
        env:
          # --- LLM provider: Gemini (primary) ---
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Check the exact model name in Google AI Studio; several names can be
          # given separated by commas and they are tried in order.
          GEMINI_MODEL: 'gemini-3.8-flash,gemini-3.7-flash'
          GEMINI_THINKING_LEVEL: 'low'
          GEMINI_MIN_OUTPUT_TOKENS: '0'
          GEMINI_RETRIES: '3'
          # 105–150 Arabic words fit comfortably below this cap and the
          # smaller request avoids OpenRouter HTTP 402 when only limited
          # credits remain.
          # 105–150 Arabic words fit below this; the conservative cap also
          # survives the account's fluctuating OpenRouter credit budget.
          LLM_MAX_COMPLETION_TOKENS: '512'
          LLM_TIMEOUT: '45'

          # --- LLM provider: OpenRouter (optional fallback only) ---
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: 'google/gemini-2.5-flash'
          OPENROUTER_MAX_ATTEMPTS: '3'
          OPENROUTER_TITLE: 'Auto Publish Reels'
          GEMINI_RATE_LIMIT: '0.2'
          GEMINI_RATE_BURST: '1'
          OPENROUTER_RATE_LIMIT: '0.5'
          OPENROUTER_RATE_BURST: '1'
          OPENROUTER_POOL_ATTEMPTS: '2'
          # --- Third provider: any OpenAI-compatible endpoint (Groq by default) ---
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY || secrets.GROQ_API_KEY }}
          LLM_FALLBACK_ENDPOINT: ${{ vars.LLM_FALLBACK_ENDPOINT || 'https://api.groq.com/openai/v1/chat/completions' }}
          # Resolve this per-run from the provider's /models endpoint above.
          LLM_FALLBACK_REASONING_EFFORT: 'low'
          LLM_FALLBACK_RETRIES: '2'
          FALLBACK_RATE_LIMIT: '0.5'
          FALLBACK_RATE_BURST: '1'
          LLM_POOL_BACKOFF_BASE: '2'
          LLM_POOL_BACKOFF_MAX: '30'

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PEXELS_REQUIRED: 'true'
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          GH_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

          # --- Duration and word-count window ---
          # Natural speech is never time-stretched; accept recordings from
          # 55s to 90s so a 59.95s render is not rejected at the boundary.
          MIN_AUDIO_SECONDS: '55'
          MAX_AUDIO_SECONDS: '90'
          TARGET_AUDIO_SECONDS: '85'
          # main.py reads MIN_WORDS/MAX_WORDS; keep generated reels within
          # the 60–90 second target at SILMA's observed Arabic speaking rate.
          # الحد الأدنى تقريبي فقط؛ الحكم النهائي هو مدة MP3 الفعلية 60–90 ثانية.
          # 105 كلمة تكفي عادةً لأكثر من دقيقة مع SILMA بسرعة 1.08.
          # Edge speaks faster than SILMA; this larger window keeps the
          # generated narration inside the required 60–90 second duration.
          MIN_WORDS: '165'
          MAX_WORDS: '190'
          # BUFFER_CHANNEL_IDS is stored positionally as TikTok, YouTube,
          # Facebook in this repository's secret.
          PUBLISH_CHANNELS: 'tiktok,youtube,facebook'
          PUBLISH_DRY_RUN: ${{ inputs.dry_run || false }}
          # Publish at the fixed slot computed above, never at Buffer's queue time.
          BUFFER_SCHEDULE_MODE: 'customScheduled'
          REQUIRE_EXTERNAL_SOURCES: 'false'
          EDITORIAL_REVIEW_ENABLED: 'true'
          MIN_TASHKEEL_COVERAGE_WARN: '0.85'
          MIN_TASHKEEL_COVERAGE_FATAL: '0.65'
          FACT_CHECK_ENABLED: 'false'
          TOPIC_GENERATION_MAX_ATTEMPTS: '3'
          VOICE_ROTATION_ENABLED: 'true'
          VOICE_SELECTION_MODE: 'content'
          AUTO_VOICE_PROFILES: 'mohamed_elbed,rafik_sa,egyptian_female,hossam,hossam_uploaded,marwan,nassim,ahmed_z'
          VOICE_ROTATION_STATE_FILE: 'state/voice_rotation.json'
          MIN_SCENE_CLIPS: '4'

          # --- Topic history ---
          TOPIC_HISTORY_FILE: 'topic_history.json'

          # --- Fact Check (uses Wikipedia as source) ---
          FACT_CHECK_SOURCES_FILE: 'config/fact_sources.json'
          FACT_CHECK_MODEL: 'google/gemma-4-26b-a4b-it:free,google/gemma-4-31b-it:free,nvidia/nemotron-3-super-120b-a12b:free'
          FACT_CHECK_MIN_CONFIDENCE: '0.85'
          FACT_CHECK_MAX_SOURCE_CHARS: '6000'
          FACT_CHECK_MAX_TOTAL_SOURCE_CHARS: '8000'
          FACT_CHECK_MAX_COMPLETION_TOKENS: '2048'
          WIKI_LANG: 'ar'

          # --- TTS ---
          TTS_ENGINE: "edge"
          EDGE_TTS_VOICES: "ar-EG-ShakirNeural"
          EDGE_TTS_VOICE: "ar-EG-ShakirNeural"
          SILMA_REFERENCE_PROFILE: ${{ inputs.voice_profile || 'auto' }}
          SILMA_VOICE_PROFILES_FILE: 'assets/voices/voice_profiles.json'
          # قراءة طبيعية أبطأ؛ لا نسرّع الصوت ولا نضغط الكلمات.
          SILMA_SPEED: '1.08'
          SILMA_MAX_ATTEMPTS: '2'
          SILMA_MIN_SCORE: '0.6'
          SILMA_GUARD_ENABLED: 'true'
          WHISPER_MODEL: 'base'
          ASR_MIN_MATCH_RATIO: '0.82'
          SILMA_FALLBACK_TO_EDGE: 'true'
          EDGE_TTS_RATE: "-15%"
          EDGE_TTS_PITCH: "-2Hz"
          MUSIC_VOLUME: '0.07'
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}

        run: |
          test -f main.py || { echo "ERROR: main.py is missing"; exit 1; }
          test -f llm_gemini.py || { echo "ERROR: llm_gemini.py is missing"; exit 1; }
          test -f tts_quality.py || { echo "ERROR: tts_quality.py is missing"; exit 1; }
          test -f assets/voices/voice_profiles.json || { echo "ERROR: voice profiles config is missing"; exit 1; }
          test -f fact_check.py || { echo "ERROR: fact_check.py is missing"; exit 1; }
          python main.py

      - name: Verify final montage and B-roll output
        run: |
          test -s output/final_video.mp4 || { echo "ERROR: final video missing or empty"; exit 1; }
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 output/final_video.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 output/final_video.mp4
          echo "Professional vertical montage with topic-specific Pexels B-roll verified."

      - name: Upload Fact Check report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fact-check-report
          path: work/**/fact_check.json
          if-no-files-found: ignore

      - name: Persist topic history
        if: success()
        run: |
          if [ ! -f topic_history.json ] && [ ! -f state/voice_rotation.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add topic_history.json state/voice_rotation.json
          if git diff --cached --quiet; then
            echo "No topic-history changes to persist."
            exit 0
          fi
          git commit -m 'chore: persist published topic history'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify Arabic narration guard
        run: python -m unittest tests.test_arabic_guard -v
