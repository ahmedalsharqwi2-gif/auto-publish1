name: Auto publish videos (Cairo 15-19)

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

concurrency:
  group: auto-publish-voice-rotation
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Show scheduled trigger time
        env:
          TZ: Africa/Cairo
        run: |
          echo "GitHub event: ${{ github.event_name }}"
          echo "Scheduled cron expression: ${{ github.event.schedule }}"
          echo "GitHub UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Cairo local time: $(date '+%Y-%m-%d %H:%M:%S %Z')"

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1

      - name: Validate rotating SILMA voice profiles
        env:
          SILMA_VOICE_PROFILES_FILE: 'assets/voices/voice_profiles.json'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import json
          config = json.loads(Path(os.environ["SILMA_VOICE_PROFILES_FILE"]).read_text())
          profiles = config.get("profiles", {})
          assert profiles, "No SILMA voice profiles configured"
          for profile_id, profile in profiles.items():
              from tts_quality import resolve_reference_profile
              wav, text = resolve_reference_profile(profile_id, Path(os.environ["SILMA_VOICE_PROFILES_FILE"]))
              print(f"Validated rotating profile {profile_id}: {wav} ({len(text.split())} words)")
          PY

      - name: Generate and publish
        env:
          # OpenRouter with multi-model fallback list of CURRENTLY-AVAILABLE
          # free models (verified September 2026).
          # If all fail, check https://openrouter.ai/collections/free-models
          # and update OPENROUTER_MODEL below.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: 'google/gemma-4-26b-a4b-it:free,google/gemma-4-31b-it:free,inclusionai/ling-3.0-flash-sante:free,inclusionai/ling-3.0-flash-fin:free,nvidia/nemotron-3-super-120b-a12b:free,z-ai/glm-5.2:free,cohere/north-mini-code:free'
          OPENROUTER_TITLE: 'Auto Publish Reels'

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          GH_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

          MIN_AUDIO_SECONDS: '60'
          MAX_AUDIO_SECONDS: '90'
          TARGET_AUDIO_SECONDS: '85'
          MIN_SCRIPT_WORDS: '120'
          MAX_SCRIPT_WORDS: '165'
          REQUIRE_EXTERNAL_SOURCES: 'false'
          VOICE_ROTATION_ENABLED: 'true'
          MIN_SCENE_CLIPS: '4'

          TOPIC_HISTORY_FILE: 'topic_history.json'
          TOPIC_BANK_FILE: 'config/topic_bank.json'
          FACT_CHECK_SOURCES_FILE: 'config/fact_sources.json'

          FACT_CHECK_MODEL: 'google/gemma-4-26b-a4b-it:free,google/gemma-4-31b-it:free,inclusionai/ling-3.0-flash-sante:free,inclusionai/ling-3.0-flash-fin:free,nvidia/nemotron-3-super-120b-a12b:free,z-ai/glm-5.2:free,cohere/north-mini-code:free'
          FACT_CHECK_MIN_CONFIDENCE: '0.85'
          FACT_CHECK_MAX_SOURCE_CHARS: '6000'
          FACT_CHECK_MAX_TOTAL_SOURCE_CHARS: '8000'
          FACT_CHECK_MAX_COMPLETION_TOKENS: '2048'
          FACT_CHECK_OPENROUTER_MAX_RETRIES: '4'

          TTS_ENGINE: 'silma'
          SILMA_REFERENCE_PROFILE: ${{ inputs.voice_profile || 'mohamed_elbed' }}
          SILMA_VOICE_PROFILES_FILE: 'assets/voices/voice_profiles.json'
          SILMA_SPEED: '1.0'
          SILMA_MAX_ATTEMPTS: '2'
          SILMA_MIN_SCORE: '0.6'
          SILMA_GUARD_ENABLED: 'true'
          SILMA_FALLBACK_TO_EDGE: 'true'
          EDGE_TTS_RATE: '-8%'
          EDGE_TTS_PITCH: '-5Hz'
          MUSIC_VOLUME: '0.07'
          DRY_RUN: 'false'

        run: |
          test -f main.py || { echo "ERROR: main.py is missing"; exit 1; }
          test -f tts_quality.py || { echo "ERROR: tts_quality.py is missing"; exit 1; }
          test -f assets/voices/voice_profiles.json || { echo "ERROR: voice profiles config is missing"; exit 1; }
          test -f config/topic_bank.json || { echo "ERROR: topic bank is missing"; exit 1; }
          test -f fact_check.py || { echo "ERROR: fact_check.py is missing"; exit 1; }
          test -f config/fact_sources.json || { echo "ERROR: Fact Check sources config is missing"; exit 1; }
          python main.py

      - name: Upload Fact Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fact-check-report
          path: work/**/fact_check.json
          if-no-files-found: ignore

      - name: Persist topic history
        if: success()
        run: |
          if [ ! -f topic_history.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add topic_history.json
          if git diff --cached --quiet; then
            echo "No topic-history changes to persist."
            exit 0
          fi
          git commit -m 'chore: persist published topic history'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
