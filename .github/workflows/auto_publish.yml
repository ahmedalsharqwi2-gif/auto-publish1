name: Auto publish videos (Cairo 15-19)

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Review the checked-in bad narration fixture only; never publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Show scheduled trigger time
        env:
          TZ: Africa/Cairo
        run: |
          echo "GitHub event: ${{ github.event_name }}"
          echo "Scheduled cron expression: ${{ github.event.schedule }}"
          echo "GitHub UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Cairo local time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1
      - name: Ensure SILMA reference voice
        run: |
          if [ ! -s assets/voice_reference_synthetic.wav ] || [ ! -s assets/voice_reference_synthetic.txt ]; then
            echo "Reference voice is missing; generating it automatically."
            python make_reference_voice.py
          else
            echo "Reference voice already exists."
          fi
      - name: Generate and publish
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          GH_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MIN_AUDIO_SECONDS: '85'
          MAX_AUDIO_SECONDS: '89'
          TARGET_AUDIO_SECONDS: '87'
          MIN_SCRIPT_WORDS: '135'
          MAX_SCRIPT_WORDS: '165'
          MIN_SCENE_CLIPS: '4'
          TOPIC_HISTORY_FILE: 'topic_history.json'
          TTS_ENGINE: 'silma'
          SILMA_REFERENCE_WAV: 'assets/voice_reference_synthetic.wav'
          SILMA_SPEED: '1.0'
          SILMA_MAX_ATTEMPTS: '2'
          SILMA_MIN_SCORE: '0.6'
          SILMA_GUARD_ENABLED: 'true'
          SILMA_FALLBACK_TO_EDGE: 'true'
          EDGE_TTS_RATE: '-8%'
          EDGE_TTS_PITCH: '-5Hz'
          MUSIC_VOLUME: '0.07'
          DRY_RUN: ${{ inputs.dry_run }}
          DRY_RUN_INPUT_FILE: tests/fixtures/bad_narration.txt
        run: |
          test -f main.py || { echo "ERROR: main.py is missing"; exit 1; }
          test -f tts_quality.py || { echo "ERROR: tts_quality.py is missing"; exit 1; }
          test -f assets/voice_reference_synthetic.wav || { echo "ERROR: reference WAV is missing; run Make SILMA reference voice first"; exit 1; }
          test -f assets/voice_reference_synthetic.txt || { echo "ERROR: reference TXT is missing; run Make SILMA reference voice first"; exit 1; }
          python main.py
      - name: Upload dry-run result
        if: ${{ inputs.dry_run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: auto-publish-editorial-dry-run
          path: work/dry_run_result.json
      - name: Persist topic history
        if: always()
        run: |
          if [ ! -f topic_history.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add topic_history.json
          git diff --cached --quiet || git commit -m 'chore: persist published topic history'
          git push
