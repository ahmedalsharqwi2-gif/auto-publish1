# ضعه في: .github/workflows/make_reference_voice.yml
# تشغيل يدوي مرة واحدة: Actions → "Make SILMA reference voice" → Run workflow
# يولّد assets/voice_reference_synthetic.wav و .txt ثم يرفعهما إلى المستودع.
name: Make SILMA reference voice

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install edge-tts faster-whisper

      - name: Build reference voice
        run: python make_reference_voice.py
        # لتجربة صوت آخر:
        #   run: python make_reference_voice.py --voice ar-EG-SalmaNeural --rate -8%

      - name: Commit reference files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add assets/voice_reference_synthetic.wav assets/voice_reference_synthetic.txt
          git commit -m "Update SILMA reference voice" || echo "nothing to commit"
          git push

      - name: Keep a copy as artifact (to listen before using)
        uses: actions/upload-artifact@v4
        with:
          name: silma-reference-voice
          path: assets/voice_reference_synthetic.*
